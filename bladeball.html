<script>
const $=i=>document.getElementById(i),cv=$('cv'),M=cv.getContext('2d');
// ---------- Personagens (mesmo estilo do jogo principal) ----------
function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function drawHair(ctx, x, headY, headR, sp) {
  const hc = sp.hairColor || '#2a1a00';
  ctx.fillStyle = hc;

  switch (sp.hairStyle) {
    case 'short':
      ctx.beginPath(); ctx.arc(x, headY-2, headR-1, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 4);
      break;
    case 'messy':
      ctx.beginPath(); ctx.arc(x, headY-1, headR, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 4);
      // Messy spikes
      [-4,-1,3,6].forEach(ox => {
        ctx.beginPath(); ctx.moveTo(x+ox, headY-headR);
        ctx.lineTo(x+ox-2, headY-headR-5); ctx.lineTo(x+ox+2, headY-headR-5);
        ctx.closePath(); ctx.fill();
      });
      break;
    case 'cap_back':
      ctx.beginPath(); ctx.arc(x, headY-1, headR, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 4);
      break;
    case 'wavy':
      ctx.beginPath(); ctx.arc(x, headY-1, headR, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 5);
      // Side waves
      ctx.beginPath();
      ctx.moveTo(x-headR, headY+1);
      ctx.quadraticCurveTo(x-headR-3, headY+6, x-headR, headY+11);
      ctx.quadraticCurveTo(x-headR+3, headY+16, x-headR, headY+20);
      ctx.lineTo(x-headR+4, headY+20);
      ctx.lineTo(x-headR+4, headY+1);
      ctx.fill();
      break;
    case 'stylish':
      ctx.beginPath(); ctx.arc(x, headY-2, headR, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 4);
      // Slick side
      ctx.beginPath();
      ctx.moveTo(x-headR+2, headY-2);
      ctx.lineTo(x+headR+4, headY-8);
      ctx.lineTo(x+headR+4, headY-5);
      ctx.lineTo(x-headR+2, headY+1);
      ctx.fill();
      break;
    case 'long': {
      ctx.beginPath(); ctx.arc(x, headY-1.5, headR+0.5, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+0.5, headY-2, (headR*2)-1, 4);
      // franja lateral
      ctx.beginPath(); ctx.moveTo(x-headR, headY-1); ctx.quadraticCurveTo(x-2, headY-5, x+headR-1, headY-6); ctx.lineTo(x+headR-1, headY-2); ctx.lineTo(x-headR, headY+1); ctx.fill();
      // mechas compridas dos dois lados
      roundRect(ctx, x-headR-1, headY-3, 5, 22, 2.5); ctx.fill();
      roundRect(ctx, x+headR-4, headY-3, 5, 22, 2.5); ctx.fill();
      break; }
    case 'bald':
      // Nothing / very short shadow
      ctx.fillStyle = hc + '44';
      ctx.beginPath(); ctx.arc(x, headY-1, headR-1, Math.PI, 0); ctx.fill();
      break;
    case 'hood':
      // Just a dark overlay — handled by accessory
      break;
    default:
      ctx.beginPath(); ctx.arc(x, headY-2, headR, Math.PI, 0); ctx.fill();
      ctx.fillRect(x-headR+1, headY-2, (headR*2)-2, 4);
  }
}

function drawFace(ctx, x, headY, sp) {
  const expr = sp.expression || 'neutral';
  const ec = sp.eyeColor || '#1a0800';

  // Eyes base
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x-3.5, headY+1, 3, 2.2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+3.5, headY+1, 3, 2.2, 0, 0, Math.PI*2); ctx.fill();
  // Pupils
  ctx.fillStyle = ec;
  ctx.beginPath(); ctx.arc(x-3.5, headY+1.5, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3.5, headY+1.5, 1.5, 0, Math.PI*2); ctx.fill();
  // Iris shine
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(x-2.8, headY+0.8, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4.2, headY+0.8, 0.8, 0, Math.PI*2); ctx.fill();

  // Eyebrows
  ctx.fillStyle = sp.hairColor || '#2a1a00';
  ctx.fillRect(x-6, headY-4, 5, 1.5);
  ctx.fillRect(x+1, headY-4, 5, 1.5);

  // Expression
  if (sp.blush) { ctx.fillStyle='rgba(255,105,135,0.35)'; ctx.beginPath(); ctx.arc(x-5.6, headY+4, 1.7, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+5.6, headY+4, 1.7, 0, Math.PI*2); ctx.fill(); }
  if (sp.lashes) { ctx.strokeStyle='#120800'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x-6.2,headY+0.4); ctx.lineTo(x-7.8,headY-0.9); ctx.moveTo(x-5.6,headY-0.6); ctx.lineTo(x-6.9,headY-2); ctx.moveTo(x+6.2,headY+0.4); ctx.lineTo(x+7.8,headY-0.9); ctx.moveTo(x+5.6,headY-0.6); ctx.lineTo(x+6.9,headY-2); ctx.stroke(); }
  ctx.strokeStyle = sp.lip || '#2a1800';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  if (expr === 'smile' || expr === 'cool') {
    ctx.arc(x, headY+4.5, 3.5, 0.1, Math.PI-0.1);
  } else if (expr === 'tired') {
    ctx.moveTo(x-3, headY+5); ctx.lineTo(x+3, headY+5.5);
    // droopy eyes
    ctx.fillStyle = sp.eyeColor || '#1a0800';
    ctx.beginPath(); ctx.arc(x-3.5, headY+1, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+3.5, headY+1, 1, 0, Math.PI*2); ctx.fill();
  } else if (expr === 'confused') {
    ctx.moveTo(x-3, headY+5.5); ctx.quadraticCurveTo(x, headY+4, x+3, headY+5.5);
    // One eyebrow raised
    ctx.fillStyle = sp.hairColor || '#2a1a00';
    ctx.save(); ctx.translate(x-3.5, headY-5); ctx.rotate(-0.2);
    ctx.fillRect(-2.5, 0, 5, 1.5); ctx.restore();
  } else if (expr === 'calm') {
    ctx.arc(x, headY+4.4, 2.4, 0.35, Math.PI-0.35);
  } else if (expr === 'nervous') {
    ctx.arc(x, headY+6, 3, Math.PI+0.3, -0.3);
  } else if (expr === 'sinister') {
    ctx.arc(x, headY+3.5, 4.5, 0.4, Math.PI-0.4);
    // Red iris
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(x-3.5, headY+1.5, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+3.5, headY+1.5, 1.8, 0, Math.PI*2); ctx.fill();
  } else if (expr === 'wise') {
    ctx.arc(x, headY+5, 3, 0.2, Math.PI-0.2);
    // Small wrinkle lines
    ctx.moveTo(x-7, headY-2); ctx.lineTo(x-4, headY);
    ctx.moveTo(x+4, headY); ctx.lineTo(x+7, headY-2);
  } else if (expr === 'determined') {
    ctx.moveTo(x-3.5, headY+5); ctx.lineTo(x+3.5, headY+5);
  } else if (expr === 'mysterious') {
    ctx.arc(x, headY+5, 3, 0.2, Math.PI-0.2);
  } else {
    ctx.moveTo(x-3, headY+5); ctx.lineTo(x+3, headY+5);
  }
  ctx.stroke();
}


function drawCharacterSprite(ctx,cx,cy,sp,walkAnim,isMoving,dir,scaleOverride){
  const side=dir==='left'?-1:dir==='right'?1:0, back=dir==='up';
  ctx.save();
  const sc=(scaleOverride||1)*(sp.scale||1);
  ctx.translate(cx,cy); ctx.scale(sc*(sp.widthScale||1)*(side?0.8:1),sc);
  const t=walkAnim||0, legSwing=isMoving?Math.sin(t*2.2)*7:0, armSwing=isMoving?Math.sin(t*2.2)*6:0;
  ctx.translate(isMoving?Math.sin(t*2.2):0, isMoving?Math.abs(Math.sin(t*2.2))*-2:0);
  const legW=5,legLen=14;
  [[-4,1],[4,-1]].forEach(([lx,sg])=>{
    ctx.save(); ctx.translate(lx,-legLen); ctx.rotate(legSwing*0.08*sg);
    ctx.fillStyle=sp.pants||'#222'; roundRect(ctx,-legW/2,0,legW,legLen,2); ctx.fill();
    ctx.fillStyle=sp.shoes||'#111'; roundRect(ctx,-legW/2-1,legLen-4,legW+3,5,2); ctx.fill();
    ctx.restore();
  });
  const torsoH=17,torsoW=14,torsoY=-legLen-torsoH;
  ctx.fillStyle=sp.shirt||'#4488cc'; roundRect(ctx,-torsoW/2,torsoY,torsoW,torsoH,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(ctx,-torsoW/2+2,torsoY+1,torsoW-4,5,2); ctx.fill();
  if(sp.torsoDetail&&!back) sp.torsoDetail(ctx,torsoY,torsoW);
  const armW=4,armLen=13,shoulderY=torsoY+3;
  [[-1,-1,'leftItem'],[1,1,'rightItem']].forEach(([sx,sg,item])=>{
    ctx.save(); ctx.translate(sx*(torsoW/2+1),shoulderY); ctx.rotate(sg*armSwing*0.09);
    ctx.fillStyle=sp.shirt||'#4488cc'; roundRect(ctx,-armW/2,0,armW,armLen,2); ctx.fill();
    ctx.fillStyle=sp.skin||'#f0c080'; ctx.beginPath(); ctx.arc(0,armLen+2,3,0,Math.PI*2); ctx.fill();
    if(sp[item]) sp[item](ctx,armLen);
    ctx.restore();
  });
  const neckY=torsoY-5; ctx.fillStyle=sp.skin||'#f0c080'; ctx.fillRect(-3,neckY+1,6,7);
  const headY=neckY-9,headR=9;
  ctx.beginPath(); ctx.arc(0,headY,headR,0,Math.PI*2); ctx.fillStyle=sp.skin||'#f0c080'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1; ctx.stroke();
  if(back&&sp.hairStyle!=='bald'&&sp.hairStyle!=='hood'){ctx.fillStyle=sp.hairColor||'#2a1a00';ctx.beginPath();ctx.arc(0,headY,headR,0,Math.PI*2);ctx.fill();if(sp.hairStyle==='long'){roundRect(ctx,-headR-0.5,headY-2,headR*2+1,23,4);ctx.fill()}}
  drawHair(ctx,0,headY,headR,sp);
  if(!back) drawFace(ctx,side*2.6,headY,sp);
  const acc=back&&sp.accessoryBack!==undefined?sp.accessoryBack:sp.accessory;
  if(acc){ctx.save();ctx.translate(side*1.5,0);acc(ctx,headY,headR);ctx.restore()}
  ctx.restore();
}
const CAST=[
{n:'Marcos',sp:{ skin:'#9c6a38', hairColor:'#1a0a00', hairStyle:'messy', shirt:'#2a3a6a', pants:'#1a1a2a', shoes:'#111', eyeColor:'#1a0a00', expression:'smile', scale:1 }},
{n:'Paulo',sp:{ skin:'#e8b880', hairColor:'#111', hairStyle:'cap_back', shirt:'#993300', pants:'#222', shoes:'#111', eyeColor:'#1a0800', expression:'smile', scale:1,
      accessory:(ctx,headY,r)=>{ ctx.fillStyle='#cc4400'; ctx.beginPath(); ctx.ellipse(0,headY-r+2,r+3,5,0,0,Math.PI*2); ctx.fill(); ctx.fillRect(-r-5,headY-r,8,4); } }},
{n:'Bia',sp:{ skin:'#e0b888', hairColor:'#aa00aa', hairStyle:'wavy', shirt:'#1a0a2a', pants:'#0a0a1a', shoes:'#000', eyeColor:'#ffcc00', expression:'sinister', scale:1,
      torsoDetail:(ctx,torsoY,torsoW)=>{ ctx.fillStyle='#111'; ctx.fillRect(-torsoW/2-1,torsoY+13,torsoW+2,3); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(torsoW/2-1,torsoY+16,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#1a1a1a'; ctx.fillRect(torsoW/2-3,torsoY+14,4,2); },
      accessory:(ctx,headY,r)=>{ ctx.fillStyle='#ff44cc'; ctx.fillRect(-r-1,headY-r-2,4,7); ctx.fillStyle='#44ccff'; ctx.fillRect(r-3,headY-r-2,4,7); } }},
{n:'Kiko',sp:{ skin:'#a8b4c2', hairColor:'#3a4552', hairStyle:'bald', shirt:'#7a8a99', pants:'#3a424c', shoes:'#2a2e34', eyeColor:'#00eaff', expression:'mysterious', scale:1,
      accessory:(ctx,headY,r)=>{ ctx.strokeStyle='#8fa0ae'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,headY-r); ctx.lineTo(0,headY-r-8); ctx.stroke(); ctx.fillStyle='#00eaff'; ctx.shadowColor='#00eaff'; ctx.shadowBlur=6; ctx.beginPath(); ctx.arc(0,headY-r-9,2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='rgba(0,234,255,0.22)'; ctx.fillRect(-r+1,headY-1,(r*2)-2,4); ctx.strokeStyle='#00eaff'; ctx.lineWidth=1; ctx.strokeRect(-r+1,headY-1,(r*2)-2,4); ctx.fillStyle='#3a4552'; ctx.fillRect(-r-3,headY-2,3,5); ctx.fillRect(r,headY-2,3,5); } }}
];
const HERO={
    skin:'#fce0b8', hairColor:'#c9a26a', hairStyle:'long',
    shirt:'#e0457b', pants:'#2b3a7a', shoes:'#f4f4f4',
    eyeColor:'#2a1408', expression:'calm', scale:1.05,
    lashes:1
  };
const _c=n=>CAST.find(c=>c.n===n).sp;
_c('Kiko').accessoryBack=(ctx,headY,r)=>{ctx.strokeStyle='#8fa0ae';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,headY-r);ctx.lineTo(0,headY-r-8);ctx.stroke();ctx.fillStyle='#00eaff';ctx.shadowColor='#00eaff';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(0,headY-r-9,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0};

// ---------- Utilidades ----------
const CL=(v,a,b)=>Math.max(a,Math.min(b,v)),LP=(a,b,t)=>a+(b-a)*t;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const mus=new Audio('bladeball.mp3');mus.loop=true;mus.volume=.55;
let AC=null;
function beep(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

// ---------- Estado ----------
const DEFS=[['Marcos',.90],['Paulo',.92],['Bia',.94],['Kiko',.96]];
let VW=200,VH=360,ZK=2,bg=null,st='title',result='',ovShown=0,endT=0,tm=0;
let npcs=[],hero=null,ball=null,score=0,combo=0,maxCombo=0,speed=84,defeated=0,shake=0,hitstop=0,parts=[],rings=[],texts=[];
let best=+(LS.get('blade_best')||0);
const baseSp=()=>84+defeated*12,maxSp=()=>250+defeated*22,PR=()=>CL(36-defeated*2+speed*.04,26,50);
const alive=()=>npcs.filter(n=>n.alive);

// ---------- Cenário: quadra do ginásio em pixel art ----------
function buildBg(){
 const w=Math.ceil(VW)+16,h=Math.ceil(VH)+16,o=8;bg=document.createElement('canvas');bg.width=w;bg.height=h;const g=bg.getContext('2d');
 let s=7;const r=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
 const R=(c,x,y,a,b)=>{g.fillStyle=c;g.fillRect(x|0,y|0,a|0,b|0)};
 R('#c98d4a',0,0,w,h);
 for(let x=0;x<w;x+=8){R((x/8)%2?'#bf8443':'#d19553',x,0,7,h);R('#8f5f2c',x+7,0,1,h)}
 for(let i=0;i<w*h/50;i++)R(r()<.5?'#b47a3b':'#dba25f',r()*w,r()*h,1+r()*3,1);
 // arquibancada
 R('#2b2748',0,0,w,o+44);
 for(let row=0;row<3;row++){const y=o+10+row*11;R(['#3d4f8a','#4a5fa3','#5a70b8'][row],0,y,w,9);R('#232848',0,y+9,w,2);
  for(let x=3+row*3;x<w-4;x+=9)if(r()<.7){R(['#ffdbbd','#e0ae8b','#b57345','#6e3c1d'][r()*4|0],x,y-3,3,3);R(['#d9534f','#4a8fd6','#3aa876','#e0a030','#8a5ad9','#f0f0f0'][r()*6|0],x-1,y,5,5)}}
 R('#1a1521',0,o+44,w,2);R('#e8e8ee',0,o+46,w,1);
 // linhas da quadra
 const cx=w/2|0,x0=cx-92,y0=o+58,y1=o+VH-12,cy=(y0+y1)/2|0,L='#f4efe0';
 g.fillStyle='rgba(58,110,200,.32)';g.fillRect(x0,y0,184,74);
 g.fillStyle='rgba(224,69,123,.32)';g.fillRect(x0,y1-74,184,74);
 R(L,x0,y0,184,2);R(L,x0,y1-2,184,2);R(L,x0,y0,2,y1-y0);R(L,x0+182,y0,2,y1-y0);R(L,x0,cy-1,184,2);
 for(let a=0;a<6.283;a+=.03)R(L,cx+Math.cos(a)*30,cy+Math.sin(a)*30,2,2);
 for(let a=0;a<3.1416;a+=.03){R(L,cx+Math.cos(a)*40,y0+74+Math.sin(a)*22,2,2);R(L,cx+Math.cos(a+3.1416)*40,y1-74+Math.sin(a+3.1416)*22,2,2)}
 R('#2a2a36',cx-1,cy-1,3,3);
}
function place(){const cx=VW/2,ay=Math.max(84,VH*.24),O=[[-70,40],[-24,0],[24,0],[70,40]];
 npcs.forEach((n,i)=>{n.x=cx+O[i][0];n.y=ay+O[i][1]});if(hero){hero.x=cx;hero.y=VH-56}}
function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=Math.ceil(innerWidth*d);cv.height=Math.ceil(innerHeight*d);
 ZK=Math.min(cv.width/200,cv.height/330);VW=cv.width/ZK;VH=cv.height/ZK;M.imageSmoothingEnabled=false;buildBg();place()}

// ---------- Efeitos ----------
function say(t,x,y,c,s,l){texts.push({t,x,y,c,s,l,m:l})}
function burst(x,y,n,cols,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-10,l:life*(.5+Math.random()*.5),m:life,c:cols[i%cols.length],s:1+(Math.random()*2|0)})}}
function ring(x,y,c,r1){rings.push({x,y,r:4,r1,l:.3,m:.3,c})}

// ---------- Jogo ----------
function initEnt(){
 npcs=DEFS.map(([n,sk])=>({name:n,sp:_c(n),skill:sk,x:0,y:0,alive:1,flash:0,rot:0,fy:0,fa:1,vx:0,vy:0,fr:0}));
 hero={x:0,y:0,sp:HERO,flash:0,swing:0,cd:0,down:0,rot:0,fa:1,fr:0};
 score=0;combo=0;maxCombo=0;speed=84;defeated=0;parts=[];rings=[];texts=[];shake=0;hitstop=0;
 ball={x:VW/2,y:VH/2,tgt:hero,vis:0,wait:1e9,trail:[],reserve:0,perfect:0};place()}
function start(){initEnt();ovShown=0;$('ov').style.display='none';st='play';ball.wait=1.5;ball.reserve=1;
 say('PREPARAR!',VW/2,VH/2,'#fff',12,1.4);mus.play().catch(()=>{})}
function serve(){const al=alive(),o=al[Math.random()*al.length|0];ball.x=o.x;ball.y=o.y-13;ball.tgt=hero;ball.vis=1;ball.reserve=0;ball.trail=[];ball.perfect=0;
 speed=Math.max(speed,baseSp());o.flash=.25;beep(300,.12,'sawtooth',.04)}
const bd=()=>Math.hypot(ball.x-hero.x,ball.y-(hero.y-13));
function tap(){
 if(st!=='play'||hero.cd>0||!ball.vis)return;
 const d=bd();
 if(ball.tgt===hero&&d<=PR())parry(d);
 else{hero.cd=.55;combo=0;hero.swing=.15;ring(hero.x,hero.y-13,'#9a9aa8',26);say('CEDO!',hero.x,hero.y-42,'#c0c0cc',8,.6);beep(120,.15,'square',.05)}
}
function parry(d){
 const pf=d<=PR()*.42;combo++;maxCombo=Math.max(maxCombo,combo);
 const mul=1+Math.min(4,combo/3|0),pts=(10+(pf?15:0))*mul;score+=pts;
 speed=Math.min(maxSp(),speed*1.075+3);
 const al=alive();ball.tgt=al[Math.random()*al.length|0];ball.perfect=pf;
 hero.swing=.22;hero.flash=.2;
 ring(ball.x,ball.y,pf?'#ffd24a':'#ffffff',pf?52:38);
 burst(ball.x,ball.y,pf?18:10,pf?['#ffd24a','#fff','#ff9a3c']:['#fff','#7fe3ff'],90,.45);
 shake=pf?.5:.25;hitstop=pf?.09:.05;
 say((pf?'PERFEITO! +':'+')+pts,hero.x,hero.y-46,pf?'#ffd24a':'#fff',pf?9:8,.8);
 if(combo>=3&&combo%3===0)say('COMBO x'+combo,VW/2,VH/2-20,'#ff7ac8',11,.9);
 beep(380+Math.min(combo,12)*40,.12,'square',.06)}
function npcArrive(t){
 const p=CL(t.skill+defeated*.03-(speed-84)/480-(ball.perfect?.1:0),.1,.96);
 if(Math.random()<p){
  t.flash=.25;ring(t.x,t.y-13,'#7fe3ff',34);burst(ball.x,ball.y,8,['#7fe3ff','#fff'],70,.4);shake=.2;hitstop=.04;
  speed=Math.min(maxSp(),speed*1.075+3);ball.tgt=hero;ball.perfect=0;beep(260,.1,'triangle',.06);say('BLOCK',t.x,t.y-40,'#7fe3ff',7,.5)
 }else ko(t)}
function ko(t){
 t.alive=0;t.vx=(t.x<VW/2?-1:1)*(30+Math.random()*30);t.vy=-110;defeated++;const pts=200+defeated*50;score+=pts;
 burst(t.x,t.y-13,30,['#ffd24a','#ff5b5b','#fff'],130,.7);ring(t.x,t.y-13,'#ff5b5b',70);shake=.9;hitstop=.14;
 say('K.O.! +'+pts,t.x,t.y-46,'#ff5b5b',10,1);beep(90,.35,'sawtooth',.08);
 speed=Math.max(baseSp(),speed*.7);
 if(!alive().length){win();return}
 ball.vis=0;ball.reserve=1;ball.wait=1.1}
function win(){st='over';result='won';endT=1.5;score+=500;ball.vis=0;
 burst(VW/2,VH/2,50,['#ffd24a','#ff7ac8','#7fe3ff','#fff'],150,1.2);say('VITÓRIA!',VW/2,VH/2,'#ffd24a',16,1.6);
 [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'square',.06),i*120));
 try{const j=JSON.parse(LS.get('natasha_jogos')||'[]');if(!j.includes('bladeball.html')){j.push('bladeball.html');LS.set('natasha_jogos',JSON.stringify(j))}}catch(e){}}
function lose(){st='over';result='lost';endT=1.1;hero.down=1;ball.vis=0;
 burst(hero.x,hero.y-13,26,['#ff5b5b','#fff','#ffd24a'],120,.6);ring(hero.x,hero.y-13,'#ff5b5b',60);shake=1;hitstop=.18;
 say('ERROU!',hero.x,hero.y-46,'#ff5b5b',11,1);beep(70,.5,'sawtooth',.09)}

function update(dt){
 tm+=dt;
 if(hitstop>0){hitstop-=dt;return}
 shake=Math.max(0,shake-dt*3);
 for(const o of [hero,...npcs]){o.flash=Math.max(0,o.flash-dt);o.fr+=dt*60}
 hero.swing=Math.max(0,hero.swing-dt);hero.cd=Math.max(0,hero.cd-dt);
 if(hero.down)hero.rot=Math.min(1.5,hero.rot+dt*4);
 npcs.forEach(n=>{if(!n.alive){n.fy+=n.vy*dt;n.x+=n.vx*dt;n.vy+=260*dt;n.rot+=dt*9*(n.vx>0?1:-1);n.fa=Math.max(0,n.fa-dt*1.4)}});
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 rings.forEach(q=>{q.r+=(q.r1-q.r)*Math.min(1,dt*12);q.l-=dt});rings=rings.filter(q=>q.l>0);
 texts.forEach(t=>{t.y-=12*dt;t.l-=dt});texts=texts.filter(t=>t.l>0);
 if(st==='play'){
  if(ball.wait>0){ball.wait-=dt;if(ball.wait<=0&&ball.reserve)serve()}
  else if(ball.vis){
   const t=ball.tgt,dx=t.x-ball.x,dy=t.y-13-ball.y,d=Math.hypot(dx,dy)||1,step=speed*dt;
   ball.trail.push([ball.x,ball.y]);if(ball.trail.length>14)ball.trail.shift();
   if(d<=Math.max(6,step)){t===hero?lose():npcArrive(t)}
   else{ball.x+=dx/d*step;ball.y+=dy/d*step}
  }
 }else if(st==='over'){endT-=dt;if(endT<=0&&!ovShown)showOv()}
}

// ---------- Desenho ----------
function ballCol(){const t=CL((speed-84)/230,0,1),a=[127,227,255],b=[255,210,74],c=[255,59,59],[p,q,u]=t<.5?[a,b,t*2]:[b,c,(t-.5)*2];
 return 'rgb('+p.map((v,i)=>Math.round(LP(v,q[i],u))).join(',')+')'}
function pxRing(x,y,r,c){M.fillStyle=c;const n=Math.max(18,r*1.4|0);for(let i=0;i<n;i++){if(i%3==2)continue;const a=i/n*6.283;M.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),2,2)}}
function txt(s,x,y,c,sz,al){M.font='bold '+sz+'px monospace';M.textAlign=al||'left';M.lineWidth=2.5;M.lineJoin='round';M.strokeStyle='#1a1521';M.strokeText(s,x,y);M.fillStyle=c;M.fillText(s,x,y)}
function drawChar(o,dir,sc,slashDir){
 const y=o.y+(o.fy||0),fa=o.fa==null?1:o.fa;
 if(fa>.5&&!o.down){M.fillStyle='rgba(0,0,0,.28)';M.beginPath();M.ellipse(o.x,o.y,6.5*(o.sp.scale||1)*(o.sp.widthScale||1),2.1,0,0,6.283);M.fill()}
 M.save();M.globalAlpha=fa;
 if(o.rot){M.translate(o.x,y);M.rotate(o.rot);M.translate(-o.x,-y)}
 const mv=(o.swing||0)>0||o.flash>0,wa=o.fr*.12;
 drawCharacterSprite(M,o.x,y,o.sp,wa,mv,dir,sc);
 if(o.flash>0){M.globalCompositeOperation='lighter';M.globalAlpha=fa*.55*(o.flash/.25);drawCharacterSprite(M,o.x,y,o.sp,wa,mv,dir,sc)}
 M.restore();
 if(o.flash>0||(o.swing||0)>0){const k=Math.max(o.flash/.25,(o.swing||0)/.22);M.strokeStyle='rgba(255,255,255,'+k+')';M.lineWidth=2.5;M.beginPath();
  M.arc(o.x,o.y-13,18+(1-k)*14,slashDir<0?-2.7:.45,slashDir<0?-.45:2.7);M.stroke()}
}
function draw(){
 const ox=(Math.random()-.5)*shake*6,oy=(Math.random()-.5)*shake*6;
 M.setTransform(1,0,0,1,0,0);M.fillStyle='#1b1a2b';M.fillRect(0,0,cv.width,cv.height);
 M.setTransform(ZK,0,0,ZK,ox*ZK,oy*ZK);M.imageSmoothingEnabled=false;M.drawImage(bg,-8,-8);
 // alvo atual
 if(st==='play'&&ball.vis&&ball.tgt!==hero){const t=ball.tgt,b=Math.sin(tm*8)*1.5;M.fillStyle='#ffd24a';M.beginPath();M.moveTo(t.x-4,t.y-38+b);M.lineTo(t.x+4,t.y-38+b);M.lineTo(t.x,t.y-32+b);M.fill()}
 npcs.slice().sort((a,b)=>a.y-b.y).forEach(n=>drawChar(n,'down',.42*(n.sp.scale>1?1:1),1));
 // anel de rebatida
 if(st==='play'&&ball.vis){
  const inW=ball.tgt===hero&&bd()<=PR(),pf=inW&&bd()<=PR()*.42,cy=hero.y-13;
  pxRing(hero.x,cy,PR(),hero.cd>0?'#b04a4a':inW?'#7dff9a':'rgba(255,255,255,.55)');
  pxRing(hero.x,cy,PR()*.42,pf?'#ffd24a':'rgba(255,210,74,.35)')}
 drawChar(hero,'up',.5,-1);
 // bola
 if(ball.vis){
  const c=ballCol();ball.trail.forEach((p,i)=>{M.globalAlpha=i/ball.trail.length*.6;M.fillStyle=c;const s=1+i/5|0;M.fillRect(Math.round(p[0])-s,Math.round(p[1])-s,s*2,s*2)});M.globalAlpha=1;
  M.globalAlpha=.25;M.fillStyle=c;M.beginPath();M.arc(ball.x,ball.y,10,0,6.283);M.fill();M.globalAlpha=1;
  M.fillStyle=c;M.beginPath();M.arc(ball.x,ball.y,5,0,6.283);M.fill();M.strokeStyle='#1a1521';M.lineWidth=1.2;M.stroke();
  M.fillStyle='#fff';M.fillRect(Math.round(ball.x)-2,Math.round(ball.y)-3,2,2);
  if(ball.tgt===hero&&Math.sin(tm*20)>0){M.strokeStyle='#ff3b3b';M.lineWidth=1.5;M.beginPath();M.arc(ball.x,ball.y,8,0,6.283);M.stroke()}}
 rings.forEach(q=>pxRing(q.x,q.y,q.r,q.c));
 parts.forEach(p=>{M.globalAlpha=CL(p.l/p.m*1.5,0,1);M.fillStyle=p.c;M.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});M.globalAlpha=1;
 texts.forEach(t=>{M.globalAlpha=CL(t.l/t.m*2,0,1);txt(t.t,t.x,t.y,t.c,t.s,'center')});M.globalAlpha=1;
 // HUD (sem tremor)
 M.setTransform(ZK,0,0,ZK,0,0);
 const TP=innerHeight/innerWidth>1.6?10:0;
 txt('PONTOS',6,12+TP,'#f2c14e',6);txt(String(score).padStart(5,'0'),6,22+TP,'#fff',10);
 txt('VEL',6,33+TP,'#ccc',6);M.fillStyle='#1a1521';M.fillRect(23,28+TP,58,6);M.fillStyle=ballCol();M.fillRect(24,29+TP,56*CL((speed-84)/230,0,1),4);
 npcs.forEach((n,i)=>{const x=VW-10-i*12,y=11+TP;M.fillStyle=n.alive?n.sp.skin:'#555';M.beginPath();M.arc(x,y,4.5,0,6.283);M.fill();M.strokeStyle='#1a1521';M.lineWidth=1;M.stroke();if(!n.alive)txt('x',x,y+3,'#ff5b5b',9,'center')});
 txt('REC '+best,VW-6,30+TP,'#aaa',6,'right');
 if(combo>=2)txt('COMBO x'+combo,VW/2,24+TP,'#ff7ac8',9,'center');
}

// ---------- Telas ----------
function showOv(){ovShown=1;best=Math.max(best,score);LS.set('blade_best',best);
 const o=$('ov');o.style.display='flex';const w=result==='won';
 o.innerHTML='<h1>'+(w?'VITÓRIA!':'NATASHA PERDEU')+'</h1><div class="s">'+(w?'Natasha derrotou todos os adversários!':'Errou o tempo da rebatida...')+'</div>'
  +'<div class="b">'+score+' pontos</div><div class="s">Adversários derrotados: '+defeated+'/'+DEFS.length+' · Maior combo: '+maxCombo+'<br>Recorde: '+best+'</div>'
  +'<div><button data-a="go">'+(w?'JOGAR DE NOVO':'TENTAR DE NOVO')+'</button><a href="1.html">VOLTAR À CIDADE</a></div>'}
function showTitle(){$('ov').innerHTML='<h1>DETH BALL</h1><div class="s">Ginásio da Natasha</div>'
 +'<div class="s" style="max-width:300px;margin:12px 0">Toque na tela quando a bola entrar no <b style="color:#7dff9a">anel</b> para rebater.<br>Perfeito = anel dourado.<br>Cedo demais: Natasha trava um instante. Tarde demais: ela perde!<br>Derrote todos os adversários.</div>'
 +'<div><button data-a="go">JOGAR</button><a href="1.html">VOLTAR</a></div>'}
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.a==='go')start()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();tap()}});
addEventListener('resize',rs);

initEnt();rs();showTitle();
let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
