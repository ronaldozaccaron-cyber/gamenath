<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0a26">
<title>Cidade sem Nome</title>
<style>
html,body{margin:0;height:100%;background:#0e0a26;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Courier New",monospace}
#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,3,24,.55))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#play{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 22px);display:flex;align-items:center;gap:14px;padding:16px 36px;font:bold 28px "Courier New",monospace;letter-spacing:6px;color:#1f1a33;background:#f2c14e;border:0;border-radius:6px;box-shadow:0 6px #b07f1e,0 0 0 4px #1f1a33,0 12px 20px rgba(0,0,0,.55);cursor:pointer;animation:pulse 1.6s ease-in-out infinite;z-index:5}
#play svg{width:18px;height:24px}
#play:active{animation:none;transform:translateY(5px);box-shadow:0 1px #b07f1e,0 0 0 4px #1f1a33,0 4px 10px rgba(0,0,0,.5)}
#play:focus-visible{outline:4px solid #fff;outline-offset:6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#play{animation:none}}
#fade{position:fixed;inset:0;background:#07050b;opacity:0;pointer-events:none;transition:opacity .45s;z-index:9}
#fade.on{opacity:1;pointer-events:auto}
</style></head><body>
<h1 class="sr">Cidade sem Nome</h1>
<canvas id="cv"></canvas><div id="vig"></div>
<button id="play" aria-label="Jogar"><svg viewBox="0 0 7 9" shape-rendering="crispEdges"><path fill="#1f1a33" d="M0 0h2v9H0zM2 1h2v7H2zM4 2h2v5H4zM6 3h1v3H6z"/></svg>PLAY</button>
<div id="fade"></div>

<script>
(()=>{'use strict';
const $=i=>document.getElementById(i);
const cv=$('cv'),M=cv.getContext('2d');
const fr=(c,x,y,w,h)=>{M.fillStyle=c;M.fillRect(Math.floor(x),Math.floor(y),w,h)};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return[c,c.getContext('2d')]};
const R=(x,c,X,Y,W,H)=>{x.fillStyle=c;x.fillRect(X,Y,W,H)};
const rngMake=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hsh=n=>{n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0};

/* ---------- fonte pixel 5x7 ---------- */
const F={
C:['.###.','#...#','#....','#....','#....','#...#','.###.'],
I:['#####','..#..','..#..','..#..','..#..','..#..','#####'],
D:['####.','#...#','#...#','#...#','#...#','#...#','####.'],
A:['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
E:['#####','#....','#....','####.','#....','#....','#####'],
S:['.####','#....','#....','.###.','....#','....#','####.'],
M:['#...#','##.##','#.#.#','#.#.#','#...#','#...#','#...#'],
N:['#...#','##..#','#.#.#','#..##','#...#','#...#','#...#'],
O:['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
'?':['.###.','#...#','....#','...#.','..#..','.....','..#..'],
'!':['..#..','..#..','..#..','..#..','..#..','.....','..#..']};
function bake(ch,sc,face,ext,out){
  if(ch===' ')return null;
  const g=F[ch],depth=sc,w=5*sc+2,h=7*sc+depth+2,[c,x]=mk(w,h),px=[];
  for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(g[j][i]==='#')px.push([i,j]);
  const draw=(col,ox,oy)=>{x.fillStyle=col;for(const[i,j]of px)x.fillRect(1+i*sc+ox,1+j*sc+oy,sc,sc)};
  for(let oy=-1;oy<=depth+1;oy++)for(let ox=-1;ox<=1;ox++)draw(out,ox,oy);
  for(let d=depth;d>=1;d--)draw(ext,0,d);
  draw(face,0,0);return c;
}
function glyph(ch,x,y,col){const g=F[ch];for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(g[j][i]==='#')fr(col,x+i,y+j,1,1)}

/* ---------- estado / layout ---------- */
let S=6,LW=110,LH=240,DPR=1,L={};
let skyC,gndC,farC,nearC,T1,T2,T2d;
let stars=[],clouds=[],bats=[],flies=[],wins=[],trees=[],lamps=[],beacon=null;
let par=0,parT=0,last=0,leaving=false;
const nat={hopStart:-9999,bubbleUntil:-9999};
const car={x:-50,dir:-1,color:'#d9433f',wait:2.5,active:false};
const shoot={act:false,x:0,y:0,life:0,wait:4};
const CARC=['#d9433f','#3f7fd9','#f0c23a','#3aa876','#e8e8ee','#8a5ad9','#e87a30'];

function rs(){
  DPR=Math.min(devicePixelRatio||1,2);
  cv.width=Math.ceil(innerWidth*DPR);cv.height=Math.ceil(innerHeight*DPR);
  S=Math.max(2,Math.min(Math.floor(cv.width/110),Math.floor(cv.height/150)));
  LW=Math.ceil(cv.width/S);LH=Math.ceil(cv.height/S);
  M.imageSmoothingEnabled=false;build();
}

function skyline(ctx,r,W,bodyC,topC,wMin,wMax,hMin,hMax,withWin){
  const list=[];let x=0;
  while(x<W){
    const w=wMin+(r()*(wMax-wMin+1)|0),h=Math.round(hMin+r()*(hMax-hMin)),top=L.hz-h;
    R(ctx,bodyC,x,top,w,h);R(ctx,topC,x,top,w,1);
    const k=r();
    if(k<.25){R(ctx,bodyC,x+(w>>1),top-(5+(r()*4|0)),1,8)}
    else if(k<.42&&w>=8){R(ctx,bodyC,x+2,top-4,4,4)}
    else if(k<.55&&w>=10){for(let j=1;j<=3;j++)R(ctx,bodyC,x+j,top-j,w-2*j,1)}
    if(withWin){
      for(let wy=top+4;wy<L.hz-5;wy+=5)for(let wx=x+2;wx+2<=x+w-2;wx+=4){
        R(ctx,'#1f1438',wx,wy,2,3);wins.push({x:wx,y:wy,ph:r()*6.28,f:.0003+r()*.0007});
      }
    }
    list.push({x,w,h,top});x+=w;
  }
  return list;
}

function build(){
  const r=rngMake(12345),ri=(a,b)=>a+(r()*(b-a+1)|0),wide=LW>=200;
  L.wide=wide;L.tsc=(wide&&LH>=170)?3:2;
  const sc=L.tsc,th=7*sc+sc+2;
  L.ty=Math.round(LH*(wide?.06:.075));L.line2=L.ty+th+2;L.tb=L.line2+th;
  L.hz=Math.max(Math.round(LH*.66),L.tb+44);L.natX=Math.round(LW/2);L.natY=L.hz+13;
  L.roadTop=L.hz+16;L.roadH=Math.max(10,LH-L.roadTop);
  const hz=L.hz;
  // título
  const s1='CIDADE',s2='SEM NOME';
  T1=[...s1].map(c=>bake(c,sc,'#ffd968','#c2622a','#1a0f2e'));
  T2=[...s2].map(c=>bake(c,sc,'#f9a8d4','#a03a7a','#1a0f2e'));
  T2d=[...s2].map(c=>bake(c,sc,'#7a4a72','#4a2a48','#1a0f2e'));
  L.tw=(s2.length*6-1)*sc;L.tx=Math.round((LW-L.tw)/2);
  // céu
  skyC=mk(LW,hz)[0];
  {const ctx=skyC.getContext('2d');
   const B=[['#0e0a26',0],['#150f34',.1],['#1e1444',.22],['#2d1a56',.34],['#4a2465',.46],['#7a3477',.58],['#b84f7a',.72],['#e8806f',.88]];
   B.forEach((b,i)=>{const y0=Math.round(b[1]*hz),y1=i<B.length-1?Math.round(B[i+1][1]*hz):hz;
     R(ctx,b[0],0,y0,LW,y1-y0);
     if(i>0){ctx.fillStyle=b[0];for(let x=0;x<LW;x+=2)ctx.fillRect(x+(y0&1),y0-1,1,1);for(let x=0;x<LW;x+=4)ctx.fillRect(x,y0-3,1,1)}});}
  // prédios
  wins=[];
  const maxH=Math.max(24,hz-L.tb-14),W=LW+16;
  {const [c,ctx]=mk(W,hz);farC=c;skyline(ctx,r,W,'#2b1a4d','#3a2461',10,18,maxH*.3,maxH*.72,false)}
  {const [c,ctx]=mk(W,hz);nearC=c;const bl=skyline(ctx,r,W,'#150d2a','#241645',12,22,maxH*.4,maxH,true);
   let tall=bl[0];bl.forEach(b=>{if(b.h>tall.h&&b.x>10&&b.x<W-10)tall=b});beacon={x:tall.x+(tall.w>>1),y:tall.top-9}}
  // chão
  {const gh=LH-hz+2,[c,ctx]=mk(LW,gh);gndC=c;
   R(ctx,'#5f5a72',0,0,LW,14);R(ctx,'#7a7590',0,0,LW,1);
   for(let x=0;x<LW;x+=8)R(ctx,'#524d63',x,1,1,13);
   R(ctx,'#3f3b52',0,14,LW,1);R(ctx,'#2a2838',0,15,LW,1);
   R(ctx,'#242532',0,16,LW,gh-16);
   for(let i=0;i<LW*2;i++)R(ctx,'#2c2d3c',ri(0,LW-1),ri(17,gh-1),1,1);
   const my=16+Math.floor(L.roadH*.5);for(let x=2;x<LW;x+=14)R(ctx,'#a58f2e',x,my,7,1);}
  // estrelas, nuvens, morcegos, vaga-lumes
  stars=[];const ns=Math.floor(LW*hz/330);
  for(let i=0;i<ns;i++)stars.push({x:ri(0,LW-1),y:ri(1,Math.floor(hz*.55)),ph:r()*6.28,big:r()<.15});
  clouds=[];for(let i=0;i<4;i++)clouds.push({b:r()*LW*2,y:ri(L.tb+4,Math.max(L.tb+8,Math.floor(hz*.6))),w:ri(16,28),sp:2+r()*3});
  bats=[{o:0,y:L.tb+14,sp:10,ph:0},{o:LW*.6,y:L.tb+24,sp:7,ph:2}];
  flies=[];for(let i=0;i<16;i++)flies.push({x:r()*LW,y:hz-44+r()*54,ax:3+r()*6,ay:2+r()*4,fx:.0004+r()*.0006,fy:.0005+r()*.0006,ph:r()*6.28});
  // árvores e postes
  trees=wide?[8,LW*.28,LW*.72,LW-8]:[6,LW-7];
  lamps=wide?[.16,.34,.66,.84].map(f=>Math.round(LW*f)):[Math.round(LW*.2),Math.round(LW*.86)];
  L.signX=L.natX+28;
  L.moonR=wide?12:9;L.moonX=Math.round(LW*.78);L.moonY=wide?Math.round(L.tb*.6):L.tb+Math.round((hz-L.tb)*.3);
}

/* ---------- desenhos ---------- */
function cloud(x,y,w,a){M.fillStyle='rgba(150,100,170,'+a+')';M.fillRect(Math.floor(x+2),y,w-4,1);M.fillRect(Math.floor(x),y+1,w,2);M.fillRect(Math.floor(x+3),y+3,w-6,1)}
function bat(x,y,t,ph){
  const up=((t/180+ph)|0)%2===0,c='#0a0616';x=Math.floor(x);y=Math.floor(y);
  fr(c,x-1,y+1,3,2);fr(c,x-1,y,1,1);fr(c,x+1,y,1,1);
  if(up){fr(c,x-4,y-1,1,2);fr(c,x-3,y,2,1);fr(c,x+3,y-1,1,2);fr(c,x+1,y,2,1)}
  else{fr(c,x-4,y+2,1,1);fr(c,x-3,y+1,2,1);fr(c,x+3,y+2,1,1);fr(c,x+1,y+1,2,1)}
}
function tree(x,base,h,t,ph){
  const rows=[6,10,14,16,16,14,12],cx=Math.round(x);
  fr('#2a1c14',cx-1,base-Math.round(h*.4),3,Math.round(h*.4));
  const top=base-h;
  rows.forEach((w,i)=>{
    const off=Math.round(Math.sin(t/900+i*.5+ph)*.6),y=top+i*Math.round(h*.6/rows.length*1.1);
    fr('#0f2a1c',cx-(w>>1)+off,y,w,3);
    if(i>0&&i<6)fr('#163a26',cx-(w>>1)+2+off,y+1,w-6,1);
    if(i<4)fr('#1f4f32',cx+(w>>1)-3+off,y,2,1);
  });
}
function lamp(x,base,flick){
  fr('#1a1424',x,base-36,2,36);fr('#1a1424',x-1,base-2,4,2);fr('#1a1424',x-3,base-41,8,2);
  fr(flick>.5?'#ffdb59':'#8a7a3a',x-2,base-39,6,4);fr('#1a1424',x-2,base-39,1,4);fr('#1a1424',x+3,base-39,1,4);
}
function sign(x,base,t){
  fr('#5a3d28',x,base-22,2,22);
  fr('#3a2418',x-9,base-29,20,13);fr('#7a5233',x-8,base-28,18,11);
  fr('#d8c79a',x-7,base-27,16,9);
  glyph('?',x-2,base-26,(Math.sin(t/500)>-.6)?'#3a2418':'#7a5d3a');
  fr('#3a2418',x-7,base-16,2,3);fr('#3a2418',x+7,base-16,2,3);
}
function drawCar(x,y,c,dir){
  M.save();if(dir<0){M.translate(x*2+24,0);M.scale(-1,1)}
  fr('rgba(0,0,0,.35)',x+1,y+10,24,3);
  fr(c,x,y+3,24,8);fr(c,x+5,y,13,4);fr('#5a7a9a',x+6,y+1,11,3);fr('rgba(255,255,255,.25)',x,y+3,24,1);
  fr('#0a0a0f',x+4,y+9,6,3);fr('#0a0a0f',x+16,y+9,6,3);fr('#666',x+6,y+10,2,1);fr('#666',x+18,y+10,2,1);
  fr('#ffe9a0',x+23,y+5,2,2);fr('#c42323',x,y+5,1,2);
  M.restore();
}
function drawNat(fx,fy,o){
  const HAIR='#c9a26a',HAIR2='#e2c78f',SKIN='#fce0b8',SKIN2='#eebd94',SHT='#e0457b',SHT2='#b8305f',PN='#2b3a7a',PN2='#1c2555',SHOE='#f4f4f4',SOLE='#c9c9d6',EYE='#1c0d05';
  const b=o.bob?1:0,y0=fy-30-b;
  // cabelo (atrás)
  fr(HAIR,fx-6,y0,12,1);fr(HAIR,fx-7,y0+1,14,1);fr(HAIR,fx-8,y0+2,16,4);
  fr(HAIR,fx-8,y0+6,2,15);fr(HAIR,fx+6,y0+6,2,15);fr(HAIR,fx-8,y0+6,16,9);
  // rosto
  fr(SKIN,fx-5,y0+5,10,9);fr(SKIN,fx-3,y0+14,6,1);fr(SKIN,fx-1,y0+15,2,1);
  // franja e brilhos
  fr(HAIR,fx-5,y0+5,10,4);
  fr(HAIR2,fx-4,y0+2,3,1);fr(HAIR2,fx+1,y0+3,2,1);fr(HAIR2,fx-7,y0+9,1,8);fr(HAIR2,fx+6,y0+9,1,8);
  // olhos
  if(o.blink){fr(EYE,fx-4,y0+11,2,1);fr(EYE,fx+2,y0+11,2,1)}
  else{fr(EYE,fx-4,y0+9,2,3);fr(EYE,fx+2,y0+9,2,3);fr('#ffffff',fx-4,y0+9,1,1);fr('#ffffff',fx+2,y0+9,1,1);fr(EYE,fx-5,y0+9,1,1);fr(EYE,fx+4,y0+9,1,1)}
  fr(SKIN2,fx-1,y0+11,2,1);
  fr('#f4a09a',fx-5,y0+12,2,1);fr('#f4a09a',fx+3,y0+12,2,1);
  fr('#b5535a',fx-1,y0+13,2,1);fr('#b5535a',fx-2,y0+12,1,1);fr('#b5535a',fx+1,y0+12,1,1);
  // corpo
  fr(SHT,fx-6,y0+15,12,7+b);
  fr(SHT2,fx-4,y0+16,1,5);fr(SHT2,fx+3,y0+16,1,5);
  fr(SKIN,fx-2,y0+15,4,1);fr(SKIN,fx-1,y0+16,2,1);
  fr('#ffe9a0',fx-1,y0+18,2,1);fr('#ffe9a0',fx-2,y0+19,4,1);fr('#ffe9a0',fx-1,y0+20,2,1);
  fr(SHT2,fx-4,y0+21+b,8,1);
  fr(SKIN,fx-6,y0+20,2,3);
  if(o.wave){ // braço levantado acenando
    fr(SHT,fx+6,y0+14,3,3);fr(SHT,fx+7,y0+10,2,4);fr(SKIN,fx+7+o.wv,y0+7,3,3);
  }else fr(SKIN,fx+4,y0+20,2,3);
  // pernas
  fr(PN,fx-4,fy-8,4,6);fr(PN,fx,fy-8,4,6);fr(PN2,fx-4,fy-8,8,1);fr(PN2,fx-1,fy-6,2,4);
  fr(SHOE,fx-5,fy-2,5,2);fr(SHOE,fx,fy-2,5,2);fr(SOLE,fx-5,fy-1,5,1);fr(SOLE,fx,fy-1,5,1);
}
function titleLine(arr,dim,y,t,flicker){
  const sc=L.tsc,adv=6*sc,total=arr.length*adv-sc,x0=Math.round((LW-total)/2);
  arr.forEach((c,i)=>{
    if(!c)return;let img=c;
    if(flicker&&(Math.sin(t/61+i*7.3)+Math.sin(t/173+i*3.1)>1.72||((t/5200+i*.13)%1)<.03))img=dim[i];
    const dy=Math.round(Math.sin(t/420+i*.7)*.9);
    M.drawImage(img,x0+i*adv-1,y+dy-1);
  });
}
function spark(x,y,a){
  M.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';
  M.fillRect(x,y,1,1);M.fillRect(x-1,y,1,1);M.fillRect(x+1,y,1,1);M.fillRect(x,y-1,1,1);M.fillRect(x,y+1,1,1);
  if(a>.6){M.fillRect(x-2,y,1,1);M.fillRect(x+2,y,1,1);M.fillRect(x,y-2,1,1);M.fillRect(x,y+2,1,1)}
}

function draw(t,dt){
  M.setTransform(1,0,0,1,0,0);M.globalCompositeOperation='source-over';M.globalAlpha=1;
  M.fillStyle='#0e0a26';M.fillRect(0,0,cv.width,cv.height);
  M.setTransform(S,0,0,S,0,0);M.imageSmoothingEnabled=false;
  const hz=L.hz,offF=Math.round(par*1.2),offN=Math.round(par*2.5),offT=Math.round(par*3.5);
  M.drawImage(skyC,0,0);
  // estrelas
  stars.forEach(s=>{M.globalAlpha=.35+.65*Math.max(0,Math.sin(t/600+s.ph));fr('#fff8e0',s.x,s.y,1,1);if(s.big){fr('#fff8e0',s.x-1,s.y,1,1);fr('#fff8e0',s.x+1,s.y,1,1);fr('#fff8e0',s.x,s.y-1,1,1);fr('#fff8e0',s.x,s.y+1,1,1)}});
  M.globalAlpha=1;
  // estrela cadente
  shoot.wait-=dt;
  if(!shoot.act&&shoot.wait<=0){shoot.act=true;shoot.x=LW*(.5+Math.random()*.5);shoot.y=L.tb*.4+Math.random()*(L.hz*.25);shoot.life=.8}
  if(shoot.act){shoot.life-=dt;shoot.x-=75*dt;shoot.y+=28*dt;
    for(let i=0;i<9;i++){M.fillStyle='rgba(255,255,255,'+(Math.max(0,shoot.life*1.2)*(1-i/9)).toFixed(2)+')';M.fillRect(Math.floor(shoot.x+i*2.6),Math.floor(shoot.y-i*1),1,1)}
    if(shoot.life<=0){shoot.act=false;shoot.wait=6+Math.random()*7}}
  // lua
  const mx=L.moonX+offF,my=L.moonY,mr=L.moonR;
  for(let dy=-mr;dy<=mr;dy++){const hw=Math.round(Math.sqrt(mr*mr-dy*dy));fr('#f6f0d8',mx-hw,my+dy,hw*2,1)}
  fr('#dcd5b8',mx-mr*.4,my-mr*.3,3,2);fr('#dcd5b8',mx+mr*.2,my+mr*.2,2,2);fr('#dcd5b8',mx-mr*.2,my+mr*.5,2,1);
  // nuvens
  clouds.forEach(c=>{const W2=LW+c.w*2,x=((c.b+t/1000*c.sp)%W2)-c.w;cloud(x+offF,c.y,c.w,.5)});
  // morcegos
  bats.forEach(b=>{const x=((b.o+t/1000*b.sp)%(LW+40))-20;bat(x,b.y+Math.sin(t/700+b.ph)*6,t,b.ph)});
  // prédios
  M.drawImage(farC,-8+offF,0);
  M.drawImage(nearC,-8+offN,0);
  M.fillStyle='#ffdb59';
  for(const w of wins)if(Math.sin(t*w.f+w.ph)>.4)M.fillRect(w.x-8+offN,w.y,2,3);
  if(beacon&&(t%1400)<300){fr('#ff3b3b',beacon.x-8+offN,beacon.y,1,1)}
  // neblina
  fr('rgba(200,120,150,.16)',0,hz-8,LW,8);fr('rgba(200,120,150,.12)',0,hz-14,LW,6);
  // chão
  M.drawImage(gndC,0,hz);
  // árvores (atrás)
  trees.forEach((x,i)=>tree(x+offT,hz+8,30+(i%2)*4,t,i*1.7));
  // postes, placa e Natasha
  const flick=[1,0].map((_,i)=>(Math.sin(t/37+i*5)+Math.sin(t/91+i*2)>1.6?0:1));
  lamps.forEach((x,i)=>lamp(x,hz+14,i===0?flick[0]:1));
  sign(L.signX,hz+14,t);
  // Natasha
  const k=(t-nat.hopStart)/1000,hop=(k>=0&&k<.55)?Math.round(Math.sin(k/.55*Math.PI)*9):0;
  fr('rgba(0,0,0,.35)',L.natX-8,L.natY-1,16,2);
  const waving=((t%7000)>5200&&(t%7000)<6800)||(t<nat.bubbleUntil)||leaving;
  drawNat(L.natX,L.natY-hop,{bob:Math.sin(t/650)>0,blink:(t%3200)<130,wave:waving,wv:((t/160)|0)%2});
  if(t<nat.bubbleUntil){
    const top=L.natY-hop-30-16,x=L.natX-10;
    fr('#1f1a33',x,top,21,11);fr('#ffffff',x+1,top+1,19,9);
    fr('#1f1a33',L.natX-2,top+11,4,1);fr('#ffffff',L.natX-1,top+10,2,1);fr('#1f1a33',L.natX-1,top+12,2,1);
    glyph('O',x+2,top+2,'#1f1a33');glyph('I',x+8,top+2,'#1f1a33');glyph('!',x+14,top+2,'#1f1a33');
  }
  // carro
  const carY=()=>car.dir>0?L.roadTop+Math.floor(L.roadH*.12):L.roadTop+Math.floor(L.roadH*.6);
  car.wait-=dt;
  if(!car.active&&car.wait<=0){car.active=true;car.dir=-car.dir;car.color=CARC[Math.random()*CARC.length|0];car.x=car.dir>0?-30:LW+30}
  if(car.active){car.x+=car.dir*(car.dir>0?16:24)*dt;
    if((car.dir>0&&car.x>LW+40)||(car.dir<0&&car.x<-40)){car.active=false;car.wait=6+Math.random()*6}}
  if(car.active)drawCar(Math.floor(car.x),carY(),car.color,car.dir);
  // vaga-lumes
  flies.forEach(f=>{const a=.5+.5*Math.sin(t/400+f.ph),x=f.x+Math.sin(t*f.fx+f.ph)*f.ax,y=f.y+Math.cos(t*f.fy+f.ph)*f.ay;
    M.fillStyle='rgba(216,245,122,'+(.12+.3*a).toFixed(2)+')';M.fillRect(Math.floor(x)-1,Math.floor(y)-1,3,3);
    if(a>.45)fr('#e9ff9a',x,y,1,1)});
  // brilhos
  M.globalCompositeOperation='lighter';
  let g=M.createRadialGradient(mx,my,0,mx,my,mr*3.4);g.addColorStop(0,'rgba(170,190,255,.22)');g.addColorStop(1,'rgba(170,190,255,0)');M.fillStyle=g;M.fillRect(mx-mr*3.4,my-mr*3.4,mr*6.8,mr*6.8);
  lamps.forEach((x,i)=>{const f=i===0?flick[0]:1,a=(.2+Math.sin(t/200+i)*.03)*(f?1:.3);
    const gg=M.createRadialGradient(x+1,hz-22,0,x+1,hz-22,26);gg.addColorStop(0,'rgba(255,205,90,'+a.toFixed(3)+')');gg.addColorStop(1,'rgba(255,205,90,0)');M.fillStyle=gg;M.fillRect(x-25,hz-48,52,52)});
  if(car.active){const cy=carY(),hx=car.dir>0?car.x+25:car.x-1;
    const gc=M.createRadialGradient(hx,cy+6,0,hx,cy+6,16);gc.addColorStop(0,'rgba(255,235,160,.35)');gc.addColorStop(1,'rgba(255,235,160,0)');M.fillStyle=gc;M.fillRect(hx-16,cy-10,32,32)}
  if(beacon&&(t%1400)<300){const bx=beacon.x-8+offN,gb=M.createRadialGradient(bx,beacon.y,0,bx,beacon.y,6);gb.addColorStop(0,'rgba(255,60,60,.5)');gb.addColorStop(1,'rgba(255,60,60,0)');M.fillStyle=gb;M.fillRect(bx-6,beacon.y-6,12,12)}
  M.globalCompositeOperation='source-over';
  // título
  titleLine(T1,null,L.ty,t,false);
  titleLine(T2,T2d,L.line2,t,true);
  for(let i=0;i<7;i++){
    const cyc=t/1300+i*.37,id=Math.floor(cyc),ph=cyc-id;if(ph>.6)continue;
    const h=hsh(id*13+i*7),sx=L.tx+(h%1000)/1000*L.tw,sy=L.ty+((h>>>10)%1000)/1000*(L.tb-L.ty);
    spark(Math.floor(sx),Math.floor(sy),Math.sin(ph/.6*Math.PI));
  }
}

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  par+=(parT-par)*Math.min(1,dt*3);
  draw(t,dt);
}

/* ---------- interação ---------- */
function pt(e){
  parT=(e.clientX/innerWidth-.5)*2;
  return[e.clientX*DPR/S,e.clientY*DPR/S];
}
addEventListener('pointermove',e=>{pt(e)});
cv.addEventListener('pointerdown',e=>{
  const[lx,ly]=pt(e);
  if(Math.abs(lx-L.natX)<14&&ly>L.natY-38&&ly<L.natY+3){const t=performance.now();nat.hopStart=t;nat.bubbleUntil=t+1300}
});
addEventListener('resize',rs);
addEventListener('pageshow',()=>{leaving=false;$('fade').classList.remove('on')});
$('play').onclick=()=>{
  if(leaving)return;leaving=true;fadeMusic();
  nat.hopStart=performance.now();
  setTimeout(()=>$('fade').classList.add('on'),450);
  setTimeout(()=>{location.href='1.html'},950);
};

/* ---------- música de fundo (menu.mp3) ---------- */
const mus=new Audio('menu.mp3');mus.loop=true;mus.volume=.5;
const tryPlay=()=>{if(mus.paused&&!document.hidden)mus.play().then(unbind).catch(()=>{})};
const EV=['pointerdown','touchstart','click','keydown'];
const unbind=()=>EV.forEach(v=>removeEventListener(v,tryPlay));
EV.forEach(v=>addEventListener(v,tryPlay,{passive:true}));
tryPlay();
document.addEventListener('visibilitychange',()=>{if(document.hidden)mus.pause();else if(!leaving)tryPlay()});
addEventListener('pageshow',()=>{mus.volume=.5;tryPlay()});
function fadeMusic(){const i=setInterval(()=>{mus.volume=Math.max(0,mus.volume-.05);if(mus.volume<=0){clearInterval(i);mus.pause()}},45)}

rs();requestAnimationFrame(frame);
})();
</script></body></html>
