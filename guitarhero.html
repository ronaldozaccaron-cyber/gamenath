<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Guitar Hero - Noite de Rock</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f0b18;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:monospace;color:#fff;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(#000c,#0000);pointer-events:none}
#hud>div{pointer-events:none}
.sc{font-size:11px;color:#f2c14e;letter-spacing:1px}.sc b{display:block;font-size:22px;color:#fff;text-shadow:2px 2px #000;letter-spacing:0}
#mc2{flex:1;text-align:center;font-size:10px;color:#f2c14e;letter-spacing:2px}
#mw{height:12px;border:2px solid #f2c14e;background:#0a0710;margin-bottom:2px}
#mf{display:block;height:100%;width:50%;background:linear-gradient(90deg,#d9433f,#f0c23a 50%,#3aa876);background-size:200px 100%}
#mx{font-size:22px;font-weight:bold;color:#ff9f43;text-shadow:2px 2px #000;min-width:40px;text-align:center}
.ib{pointer-events:auto!important;background:#2b1c3a;border:2px solid #f2c14e;border-radius:8px;color:#fff;font-size:18px;width:42px;height:42px;box-shadow:0 3px #000}
.ib:active{transform:translateY(3px);box-shadow:none}
#pg{position:fixed;left:0;right:0;top:0;height:4px;background:#0006}#pf{display:block;height:100%;width:0;background:#d9433f}
#cb{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;font-size:46px;font-weight:bold;color:#fff;text-shadow:3px 3px #000,0 0 14px #d9433f;opacity:0}
#cb small{display:block;font-size:13px;letter-spacing:4px;color:#f2c14e;text-shadow:none}
#cb.on{opacity:1;animation:pu .18s}
@keyframes pu{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#jd{position:fixed;left:0;right:0;top:56%;text-align:center;pointer-events:none;font-size:24px;font-weight:bold;text-shadow:3px 3px #000;opacity:0}
#jd.go{animation:jd .5s ease-out}
@keyframes jd{0%{opacity:1;transform:translateY(8px) scale(.7)}25%{transform:none scale(1.1)}100%{opacity:0;transform:translateY(-18px)}}
#ov{position:fixed;inset:0;background:rgba(10,6,18,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}
.card{width:100%;max-width:420px;background:#1f1a33;border:3px solid #f2c14e;border-radius:8px;padding:18px;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.6);line-height:1.4;font-size:15px}
.card h1{margin:0;font-size:32px;color:#d9433f;text-shadow:3px 3px #000,0 0 10px #f2c14e55}
.sb{color:#f2c14e;font-weight:bold;letter-spacing:2px;margin:6px 0}
#dc{image-rendering:pixelated;width:192px;height:56px;margin:6px 0}
.g{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;margin:12px 0;font-size:16px}.g b{color:#f2c14e}
.st{font-size:34px;letter-spacing:6px;color:#f2c14e}.st i{font-style:normal;opacity:.25}
.b{display:block;width:100%;min-height:56px;margin-top:10px;font:bold 20px monospace;border:0;border-radius:6px;background:#f2c14e;color:#1f1a33;box-shadow:0 4px #c2952a}
.b:active{transform:translateY(4px);box-shadow:0 0 #c2952a}
.b.n{background:#4a4468;color:#fff;box-shadow:0 4px #2c2842;font-size:16px;min-height:48px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div class="sc">PONTOS<b id="sc">0</b></div><div id="mc2"><div id="mw"><i id="mf"></i></div>ROCK</div><div id="mx">x1</div><button class="ib" id="ps">⏸</button><button class="ib" id="mu">🔊</button></div>
<div id="pg"><i id="pf"></i></div>
<div id="cb"></div><div id="jd"></div>
<div id="ov"></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d');
//GEN
function chart(ons,dur){let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 const out=[];let last=-9,pl=1;
 for(const t of ons){if(t<1.8||t>dur-1)continue;const p=t/dur,gap=.55-.33*p;if(t-last<gap)continue;
  const set=p<.25?[1,2]:[0,1,2,3];let l,k=0;do{l=set[rnd()*set.length|0]}while(l===pl&&rnd()<.75&&k++<6);
  out.push({t,l,s:0});pl=l;last=t;
  if(p>.6&&rnd()<.22){let l2;do{l2=rnd()*4|0}while(l2===l);out.push({t,l:l2,s:0})}}
 return out}
//ENDGEN
async function analyze(){try{const r=await fetch('guitarhero.mp3');if(!r.ok)throw 0;const ab=await r.arrayBuffer();
 const ac=new(window.AudioContext||webkitAudioContext)();const d=await ac.decodeAudioData(ab);try{ac.close()}catch(e){}
 const x=d.getChannelData(0),sr=d.sampleRate,hop=1024,n=x.length/hop|0,e=new Float32Array(n),f=new Float32Array(n);
 for(let i=0;i<n;i++){let s=0;for(let j=i*hop+1;j<(i+1)*hop;j++){const df=x[j]-x[j-1];s+=df*df}e[i]=Math.sqrt(s/hop)}
 for(let i=1;i<n;i++)f[i]=Math.max(0,e[i]-e[i-1]);
 const ons=[];for(let i=2;i<n-2;i++){let m=0,k=0;for(let j=Math.max(0,i-20);j<Math.min(n,i+20);j++){m+=f[j];k++}m/=k;
  if(f[i]>m*1.6+1e-4&&f[i]>=f[i-1]&&f[i]>=f[i+1]&&f[i]>=f[i-2]&&f[i]>=f[i+2])ons.push(i*hop/sr)}
 return{ons,dur:d.duration}}catch(e){return null}}
const LC=['#3aa876','#d9433f','#f0c23a','#4a8fd6'],LEAD=1.6;
const PN={h:'#c9a26a',s:'#fce0b8',e:'#2a1408',m:'#c0574f',p:'#e0457b',b:'#2b3a7a',w:'#f4f4f4'};
const NAT=["...hhhhhh...","..hhhhhhhh..",".hhhhhhhhhh.",".hhsssssshh.",".hhsesseshh.",".hhssmmsshh.",".hh.ssss.hh.",".hhpppppphh.",".hpppppppph.",".spppppppps.","..pppppppp..","..bbbbbbbb..","..bbbbbbbb..","..bbb..bbb..","..bbb..bbb..","..bbb..bbb..",".wwww..wwww.",".wwww..wwww."];
const ROSE=["..rrr..",".rrRrr.","rrRrRrr",".rrRrr.","..rrr..","...g...","..ggg.."],RP={r:'#d9433f',R:'#8c1f1f',g:'#3d6e47'};
const SKULL=[".wwwwwww.","wwwwwwwww","wwkkwkkww","wwkkwkkww","wwwwkwwww",".wwwwwww.","..w.w.w.."],SP={w:'#f4f0e6',k:'#111'};
const W=120;let H=240,SH=82,HY=214,SPD=100;
let G={state:'menu',T:0,notes:[],ni:0,score:0,combo:0,best:0,perf:0,good:0,miss:0,stray:0,meter:50,dur:90,hurt:0},LN=[{p:0},{p:0},{p:0},{p:0}],SPK=[],mut=false,rec=0,AC;
try{rec=+localStorage.getItem('gh_rec')||0}catch(e){}
const au=new Audio('guitarhero.mp3');au.volume=.85;
function rs(){H=Math.max(200,Math.min(300,Math.round(W*innerHeight/innerWidth)));cv.width=W;cv.height=H;c.imageSmoothingEnabled=false;SH=Math.round(H*.34);HY=H-26;SPD=(HY-(SH-6))/LEAD}
addEventListener('resize',rs);rs();
function sfx(f,d=.1,ty='square',sl=0,v=.07){if(mut)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function spr(rows,pal,x,y,u,fl){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(k!=='.'){c.fillStyle=fl?'#fff':pal[k];c.fillRect(x+i*u,y+j*u,u,u)}}})}
function jd(t,col){const e=$('jd');e.textContent=t;e.style.color=col;e.className='';void e.offsetWidth;e.className='go'}
function hud(pl){const m=1+Math.min(3,G.combo/10|0);$('sc').textContent=G.score;$('mx').textContent='x'+m;$('mf').style.width=G.meter+'%';
 const cb=$('cb');if(G.combo>=3){cb.innerHTML=G.combo+'<small>COMBO</small>';if(pl){cb.className='';void cb.offsetWidth}cb.className='on'}else cb.className='';
 $('pf').style.width=Math.min(100,G.T/G.dur*100)+'%'}
function hit(l){if(G.state!=='play')return;LN[l].p=1;let b=null,bd=9;
 for(let i=G.ni;i<G.notes.length;i++){const n=G.notes[i];if(n.t>G.T+.3)break;if(n.l!==l||n.s)continue;const d=Math.abs(n.t-G.T);if(d<bd){bd=d;b=n}}
 if(b&&bd<=.15){b.s=1;const pf=bd<=.075;G.combo++;G.best=Math.max(G.best,G.combo);const m=1+Math.min(3,G.combo/10|0);
  G.score+=(pf?100:60)*m;G.meter=Math.min(100,G.meter+(pf?2.5:1.5));pf?G.perf++:G.good++;jd(pf?'PERFEITO!':'BOM!',pf?'#f2c14e':'#7fd1ff');
  for(let k=0;k<6;k++)SPK.push({x:l*30+15,y:HY,vx:(Math.random()-.5)*60,vy:-Math.random()*60-10,l,life:.4});hud(1)}
 else{G.stray++;G.combo=0;G.meter=Math.max(0,G.meter-3);G.hurt=.2;sfx(110,.12,'sawtooth',-30);hud()}}
cv.onpointerdown=e=>{e.preventDefault();hit(Math.min(3,Math.max(0,Math.floor(e.clientX/innerWidth*4))))};
addEventListener('keydown',e=>{const l='dfjk'.indexOf(e.key);if(l>=0&&!e.repeat)hit(l)});
function ov(h){$('ov').innerHTML='<div class="card">'+h+'</div>';$('ov').style.display='flex';const d=$('dc');if(d){const x=d.getContext('2d');const s=(r,p,X,Y)=>r.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]!=='.'){x.fillStyle=p[row[i]];x.fillRect(X+i,Y+j,1,1)}});s(ROSE,RP,6,3);s(SKULL,SP,19,3);s(ROSE,RP,35,3)}}
function back(){history.length>1?history.back():location.href='1.html'}
function menu(){G.state='menu';ov('<h1>GUITAR HERO</h1><p class="sb">NOITE DE ROCK</p><canvas id="dc" width="48" height="14"></canvas><p>Toque nas notas quando elas chegarem na linha dourada. Combos aumentam o multiplicador. Se a barra <b style="color:#f2c14e">ROCK</b> zerar, a plateia vaia!</p><p>Recorde: <b style="color:#f2c14e">'+rec+'</b></p><button class="b" id="go">TOCAR</button><button class="b n" id="bk">VOLTAR À CIDADE</button>');$('go').onclick=play;$('bk').onclick=back}
async function play(){G.state='load';ov('<h1>PREPARANDO</h1><p class="sb">AFINANDO A GUITARRA...</p><p>Analisando a música</p>');
 const r=await analyze();let dur=r?r.dur:(isFinite(au.duration)?au.duration:90),ons=r&&r.ons.length>30?r.ons:null;
 if(!ons){ons=[];for(let t=2;t<dur;t+=.25)ons.push(t)}
 const notes=chart(ons,dur);
 G={state:'starting',T:0,notes,ni:0,score:0,combo:0,best:0,perf:0,good:0,miss:0,stray:0,meter:50,dur,hurt:0,last:notes.length?notes[notes.length-1].t:5};
 SPK=[];$('ov').style.display='none';hud();
 try{au.currentTime=0}catch(e){}
 const go=()=>{if(G.state==='starting'){G.state='play';G.T=(!au.paused&&au.currentTime)||0}};
 const p=au.play();if(p&&p.then)p.then(go,go);else go();setTimeout(go,900)}
function pause(){if(G.state!=='play')return;G.state='pause';au.pause();ov('<h1>PAUSADO</h1><button class="b" id="rs">CONTINUAR</button><button class="b n" id="qt">SAIR</button>');
 $('rs').onclick=()=>{$('ov').style.display='none';G.state='play';au.play().catch(()=>{})};$('qt').onclick=()=>{au.pause();menu()}}
function finish(ok){if(G.state==='end')return;G.state='end';au.pause();const tot=G.notes.length||1,acc=(G.perf+G.good*.6)/tot,er=G.miss+G.stray;
 const stars=ok?(acc>.95?5:acc>.85?4:acc>.7?3:acc>.5?2:1):0,nr=G.score>rec;if(nr){rec=G.score;try{localStorage.setItem('gh_rec',rec)}catch(e){}}
 (ok?[523,659,784,1046]:[300,250,200,150]).forEach((f,i)=>setTimeout(()=>sfx(f,.2,ok?'square':'sawtooth',0,.09),i*160));
 setTimeout(()=>{ov('<h1 style="'+(ok?'':'color:#d9433f')+'">'+(ok?'SHOW ÉPICO!':'VAIADO!')+'</h1><p class="sb">'+(ok?'A PLATEIA ENLOUQUECEU':'A PLATEIA PERDEU A PACIÊNCIA')+'</p><div class="st">'+'★'.repeat(stars)+'<i>'+'★'.repeat(5-stars)+'</i></div><div class="g"><span>PONTOS</span><b>'+G.score+'</b><span>PRECISÃO</span><b>'+Math.round(acc*100)+'%</b><span>PERFEITOS</span><b>'+G.perf+'</b><span>BONS</span><b>'+G.good+'</b><span>ERROS</span><b>'+er+'</b><span>MAIOR COMBO</span><b>'+G.best+'</b><span>RECORDE</span><b>'+rec+'</b></div>'+(nr?'<p class="sb">★ NOVO RECORDE! ★</p>':'')+'<button class="b" id="ag">TOCAR DE NOVO</button><button class="b n" id="bk">VOLTAR À CIDADE</button>');$('ag').onclick=play;$('bk').onclick=back},900)}
function upd(dt){for(const l of LN)l.p=Math.max(0,l.p-dt*5);G.hurt=Math.max(0,G.hurt-dt);
 SPK=SPK.filter(s=>{s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=200*dt;return s.life>0});
 if(G.state!=='play')return;
 G.T+=dt;if(!au.paused&&au.currentTime>.05&&Math.abs(au.currentTime-G.T)>.06)G.T=au.currentTime;
 while(G.ni<G.notes.length&&G.notes[G.ni].t<G.T-.15){const n=G.notes[G.ni++];if(!n.s){n.s=-1;G.miss++;G.combo=0;G.meter=Math.max(0,G.meter-7);G.hurt=.2;jd('ERROU','#d9433f');sfx(110,.12,'sawtooth',-30);hud()}}
 if(G.meter<=0)return finish(false);
 if(G.T>=G.dur-.1||(G.ni>=G.notes.length&&G.T>G.last+1.5))return finish(true);
 if((G.T*10|0)%3===0)hud()}
function draw(t){const T=G.T;
 c.fillStyle='#160f24';c.fillRect(0,0,W,H);c.fillStyle='#1e1433';c.fillRect(0,0,W,SH);
 c.fillStyle='#241740';for(let x=0;x<W;x+=12)c.fillRect(x,0,6,SH);
 [['rgba(255,90,90,.14)',20],['rgba(255,220,120,.14)',60],['rgba(120,180,255,.14)',100]].forEach(([col,bx],i)=>{const sw=Math.sin(t*1.3+i*2)*16;c.fillStyle=col;c.beginPath();c.moveTo(bx,0);c.lineTo(bx+sw-16,SH);c.lineTo(bx+sw+16,SH);c.fill()});
 c.fillStyle='#5a1220';c.fillRect(30,2,60,22);c.fillStyle='#f2c14e';c.fillRect(30,24,60,2);c.fillRect(30,2,60,1);
 spr(SKULL,SP,55,4,1);spr(ROSE,RP,38,5,1);spr(ROSE,RP,75,5,1);c.fillStyle='#f2c14e';c.font='bold 6px monospace';c.textAlign='center';c.fillText('ROCK & ROSES',60,21);
 [4,W-20].forEach(x=>{c.fillStyle='#0a0a0f';c.fillRect(x,SH-30,16,28);c.fillStyle='#2b2b36';for(let j=0;j<4;j++)for(let i=0;i<3;i++)c.fillRect(x+2+i*5,SH-24+j*5,3,3);c.fillStyle='#d9433f';c.fillRect(x,SH-30,16,2)});
 c.fillStyle='#3b2a24';c.fillRect(0,SH-10,W,14);c.fillStyle='#2a1c18';for(let x=0;x<W;x+=14)c.fillRect(x,SH-10,1,14);
 const bt=Math.floor(t*4)%2,hy=G.combo>=10&&bt?3:0,nx=48,ny=SH-46-hy-(bt?0:1);
 spr(NAT,PN,nx,ny,2,G.hurt>0&&Math.floor(t*20)%2);
 c.fillStyle='#111';c.fillRect(nx+2,ny-3,20,3);c.fillRect(nx+6,ny-13,12,10);c.fillStyle='#d9433f';c.fillRect(nx+6,ny-6,12,2);
 c.fillStyle='#b31b1b';c.fillRect(nx+8,ny+22,12,9);c.fillStyle='#e05050';c.fillRect(nx+8,ny+22,12,2);c.fillStyle='#111';c.fillRect(nx+13,ny+25,3,3);
 c.fillStyle='#6b4423';for(let i=0;i<9;i++)c.fillRect(nx+20+i*2,ny+22-(i*1.3|0),2,2);c.fillStyle='#2b2b36';c.fillRect(nx+38,ny+10,4,4);
 const wild=Math.min(4,G.combo/8);for(let i=0;i<14;i++){const x=i*9+2,b=Math.sin(t*4+i)*(1+wild*.5)|0;c.fillStyle='#0a0710';c.fillRect(x,SH-4+b,7,8);if(i%3==0||wild>2&&i%2){c.fillRect(x+2,SH-11+b,2,7)}}
 c.fillStyle='#0f0b18';c.fillRect(0,SH+4,W,H-SH-4);
 for(let l=0;l<4;l++){c.fillStyle=LC[l]+'18';c.fillRect(l*30,SH+4,30,H-SH-4);c.fillStyle='#2b2440';c.fillRect(l*30,SH+4,1,H-SH-4)}
 c.fillStyle='#ffffff10';for(let y=SH+4+(T*SPD)%18;y<H;y+=18)c.fillRect(0,y|0,W,1);
 c.save();c.beginPath();c.rect(0,SH+4,W,H);c.clip();
 const notes=G.notes;for(let i=G.ni;i<notes.length;i++){const n=notes[i];if(n.t>T+LEAD+.1)break;const y=HY-(n.t-T)*SPD,x=n.l*30+3;if(n.s===1)continue;
  c.fillStyle='#0a0a0f';c.fillRect(x-1,y-5,26,10);c.fillStyle=n.s===-1?'#555':LC[n.l];c.fillRect(x,y-4,24,8);c.fillStyle='rgba(255,255,255,.45)';c.fillRect(x,y-4,24,2);c.fillStyle='rgba(0,0,0,.3)';c.fillRect(x,y+2,24,2);c.fillStyle='#fff';c.fillRect(x+11,y-1,2,2)}
 c.restore();
 c.fillStyle='rgba(242,193,78,.7)';c.fillRect(0,HY-1,W,2);
 for(let l=0;l<4;l++){const p=LN[l].p,x=l*30+4;c.fillStyle='#0a0a0f';c.fillRect(x-1,HY-8,24,16);c.fillStyle=LC[l];c.fillRect(x,HY-7,22,14);c.fillStyle=p>0?'#fff':'#1a1426';c.fillRect(x+3,HY-4,16,8);c.fillStyle=p>0?LC[l]:LC[l]+'66';c.fillRect(x+5,HY-2,12,4)}
 SPK.forEach(s=>{c.fillStyle=LC[s.l];c.fillRect(s.x|0,s.y|0,2,2)});
 if(G.state==='menu'||G.state==='load'){c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,W,H)}}
let last=0;function loop(ms){const t=ms/1000,dt=Math.min(.1,t-last);last=t;upd(dt);draw(t);requestAnimationFrame(loop)}
$('ps').onclick=pause;$('mu').onclick=()=>{mut=!mut;au.muted=mut;$('mu').textContent=mut?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('contextmenu',e=>e.preventDefault());
menu();requestAnimationFrame(loop);
</script></body></html>
